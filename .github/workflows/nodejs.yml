name: Node.js CI

on:
  push:
    branches: [master]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Development validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run prettier:check
      - run: npm run lint
      - run: npm test
      - run: npm run check-coverage
      - run: npm run build
      - name: Upload coverage to Coveralls
        if: github.event_name == 'push'
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        run: npm run cover && npm run coveralls

  test:
    name: Node ${{ matrix.node-version }} / ESLint ${{ matrix.eslint-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24, 26]
        eslint-version: [8, 9, 10]
        include:
          - node-version: 20.9.0
            eslint-version: 8.57.0
          - node-version: 20.9.0
            eslint-version: 9.0.0
          - node-version: 20.19.0
            eslint-version: 10.0.0
          - node-version: 22.13.0
            eslint-version: 10.0.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Prepare isolated rule-test dependencies
        id: compatibility
        env:
          ESLINT_VERSION: ${{ matrix.eslint-version }}
        run: node scripts/prepare-compatibility.js
      - name: Select runtime under test
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run existing rule tests
        working-directory: ${{ steps.compatibility.outputs.directory }}
        run: |
          node --version
          node node_modules/mocha/bin/mocha.js tests --recursive

  required-checks:
    name: Require CI status checks
    if: always()
    needs: [validation, test]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require all validation and compatibility jobs to pass
        env:
          VALIDATION: ${{ needs.validation.result }}
          TESTS: ${{ needs.test.result }}
        run: test "$VALIDATION" = success && test "$TESTS" = success
